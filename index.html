    <meta name="theme-color" content="#1a1008" />
    <title>Realm of the Trinity</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              medieval: {
                900: '#1a1008',
                800: '#2d1b0e',
                700: '#4a2c17',
                600: '#6d4c2d',
                500: '#8f6e45',
                400: '#b39263',
                300: '#d4b985',
                200: '#f0dcae',
                100: '#fcf3da',
              }
            },
            fontFamily: {
              serif: ['Merriweather', 'serif'],
            }
          }
        }
      }
    </script>
    <style>
      /* Custom Scrollbar for a rustic feel */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #2d1b0e; 
      }
      ::-webkit-scrollbar-thumb {
        background: #8f6e45; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #b39263; 
      }
      body {
        background-color: #1a1008;
        color: #f0dcae;
        margin: 0;
        padding: 0;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        touch-action: none;
      }
      html, body, #root {
        height: 100%;
        width: 100%;
      }
      /* Prevent iOS Safari address bar from hiding/showing jitter */
      #root {
        position: fixed;
        inset: 0;
      }
      canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
    </style>
